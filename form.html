
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>form</h1>
    <form action="https://httpbin.org/anything" method="post" >

        <div>
        <label for="first">First Name</label>
        <input type="text" id="first" placeholder="first name">
        <label for="last">Flast Name</label>
        <input type="text" id="last" placeholder="last name">
        </div>

        <div>
        <input type="radio" name="race" id="funrun" value="fun">
        <label for="funrun">fun run 5k </label>
        <input type="radio" name="race" id="half" value="half">
        <label for="half">Half Marathon</label>
        <input type="radio" name="race" id="full" value="full">
        <label for="full">Full Marathon</label>
        </div>

        <div>
        <label for="email">email</label>
        <input type="email" name="email" id="email">
         <label for="password">password</label>
        <input type="password" name="password" id="password">
        <button type="submit">submit</button>
        </div>

        <div>
            <label for="age">select age group</label>
            <select name="age" id="age">
            <option value="15to20">15 to 20</option>
            <option value="20to30">20 to 30</option>
            <option value="30 or more">30+</option>
            </select>
        </div>
    </form>
</body>
</html>
